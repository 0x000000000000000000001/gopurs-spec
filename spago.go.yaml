    version: 8.1.2
    location:
      githubOwner: purescript-spec
      githubRepo: purescript-spec
  dependencies:
    - aff: ">=8.0.0 <9.0.0"
    - ansi: ">=7.0.0 <8.0.0"
    - arrays: ">=7.3.0 <8.0.0"
    - avar: ">=5.0.0 <6.0.0"
