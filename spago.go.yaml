    - control: ">=6.0.0 <7.0.0"
    - datetime: ">=6.1.0 <7.0.0"
    - effect: ">=4.0.0 <5.0.0"
    - either: ">=6.1.0 <7.0.0"
    - exceptions: ">=6.1.0 <7.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - fork: ">=6.0.0 <7.0.0"
    - identity: ">=6.0.0 <7.0.0"
    - integers: ">=6.0.0 <7.0.0"
    - lists: ">=7.0.0 <8.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - newtype: ">=5.0.0 <6.0.0"
    - now: ">=6.0.0 <7.0.0"
    - ordered-collections: ">=3.2.0 <4.0.0"
    - parallel: ">=7.0.0 <8.0.0"
    - pipes: ">=8.0.0 <9.0.0"
    - prelude: ">=6.0.1 <7.0.0"
    - refs: ">=6.0.0 <7.0.0"
    - strings: ">=6.0.1 <7.0.0"
    - tailrec: ">=6.1.0 <7.0.0"
    - transformers: ">=6.1.0 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
    - debug
  test:
    main: Test.Main
    dependencies:
      - console
      - node-buffer
      - node-child-process
      - node-event-emitter
      - node-fs
      - node-os
      - node-process
      - node-streams
      - refs
      - spec-node

